  console.info(words.length)
  console.info(pinyin.length)
  console.info(meaning.length)
  alert("❌ 3 list không bằng nhau!");
}

const vocab = words.map((w,i)=> ({
  w,
  py: pinyin[i],
  vi: meaning[i]
}));

// ===============================================================
// QUIZ ENGINE

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

let order = [...Array(vocab.length).keys()];
shuffle(order);
let idx = 0;
let score = 0;
const totalQuestions = vocab.length;

function loadQ(){
  document.getElementById("progress").innerText =
  `Câu: ${idx + 1} / ${totalQuestions}`;
  const q = vocab[ order[idx] ];

  document.getElementById("question").innerText = "Từ: " + q.w;
  const box = document.getElementById("options");
  box.innerHTML = "";
  document.getElementById("result").innerHTML = "";

  // tạo đáp án sai
  let wrong = vocab.filter(v => v.w !== q.w);
  shuffle(wrong);
  wrong = wrong.slice(0,3);

  const choices = [q, ...wrong];
  shuffle(choices);

  choices.forEach(c=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = c.vi;
    div.onclick = ()=> selectAns(c, q, div);
    box.appendChild(div);
  });
}

function selectAns(chosen, correct, box){
  const res = document.getElementById("result");

  if(chosen.w === correct.w){
    score++;
    box.style.background = "#c2f7c2";
    res.innerHTML = "✔ Đúng!<br>Pinyin: " + correct.py;
  } else {
    box.style.background = "#ffb3b3";
    res.innerHTML =
      "❌ Sai rồi.<br>" +
      "Đáp án đúng: <b>" + correct.vi + "</b><br>" +
      "Pinyin: " + correct.py;
  }

  document.getElementById("score").innerText =
    `Điểm: ${score}`;

  // khóa đáp án
  document.querySelectorAll(".option").forEach(o => o.onclick = null);
}



function nextQ(){
  idx++;

  if(idx >= totalQuestions){
    alert(
      `🎉 Hoàn thành!\n` +
      `Điểm của fen: ${score} / ${totalQuestions}`
    );

    // reset
    idx = 0;
    score = 0;
    shuffle(order);

    document.getElementById("score").innerText = "Điểm: 0";
  }

  loadQ();
}
